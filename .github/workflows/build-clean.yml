name: Build Clean Price Watch APK
# Force fresh APK rebuild for the notification fixes.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Generate clean Android project
        run: |
          rm -rf android PriceWatchNative
          npx @react-native-community/cli@20.0.1 init PriceWatchNative --version 0.81.5 --skip-install
          rm -rf PriceWatchNative/src PriceWatchNative/App.tsx PriceWatchNative/App.js PriceWatchNative/index.js
          cp App.js index.js app.json babel.config.js metro.config.js PriceWatchNative/
          cp -R PriceWatchNative/android ./android
          rm -rf PriceWatchNative
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/com/pricewatchnative/MainActivity.kt')
          s=p.read_text()
          old='getMainComponentName(): String = "PriceWatchNative"'
          new='getMainComponentName(): String = "PriceWatch"'
          if old not in s: raise SystemExit('Expected React Native main component name was not found')
          p.write_text(s.replace(old,new))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          s=re.sub(r'android:label="[^"]+"','android:label="PriceWatch"',s,count=1)
          s=re.sub(r'android:icon="@mipmap/[^"]+"','android:icon="@mipmap/ic_launcher"',s,count=1)
          s=re.sub(r'android:roundIcon="@mipmap/[^"]+"','android:roundIcon="@mipmap/ic_launcher_round"',s,count=1)
          manifest.write_text(s)
          strings=Path('android/app/src/main/res/values/strings.xml')
          if strings.exists():
            ss=strings.read_text(); ss=re.sub(r'<string name="app_name">.*?</string>','<string name="app_name">PriceWatch</string>',ss); strings.write_text(ss)
          PY
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          res=Path('android/app/src/main/res'); drawable=res/'drawable-nodpi'; drawable.mkdir(parents=True,exist_ok=True); (res/'mipmap-anydpi-v26').mkdir(parents=True,exist_ok=True); (res/'values').mkdir(parents=True,exist_ok=True)
          im=Image.new('RGBA',(432,432),(8,10,14,255)); d=ImageDraw.Draw(im); d.rounded_rectangle((40,40,392,392),radius=72,fill=(8,10,14,255),outline=(255,43,61,255),width=12); d.line([(80,304),(148,236),(196,272),(276,192),(352,112)],fill=(255,43,61,255),width=20,joint='curve'); im.save(drawable/'pricewatch_mark.png','PNG',optimize=True); im.resize((264,264),Image.Resampling.LANCZOS).save(drawable/'pricewatch_launcher_foreground.png','PNG',optimize=True)
          (res/'mipmap-anydpi-v26/ic_launcher.xml').write_text('''<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/pricewatch_launcher_background"/><foreground android:drawable="@drawable/pricewatch_launcher_foreground"/></adaptive-icon>''')
          (res/'mipmap-anydpi-v26/ic_launcher_round.xml').write_text('''<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/pricewatch_launcher_background"/><foreground android:drawable="@drawable/pricewatch_launcher_foreground"/></adaptive-icon>''')
          (res/'values/pricewatch_colors.xml').write_text('''<?xml version="1.0" encoding="utf-8"?><resources><color name="pricewatch_launcher_background">#08090D</color></resources>''')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/gradle.properties'); s=p.read_text(); import re
          s=re.sub(r'^newArchEnabled=.*$','newArchEnabled=false',s,flags=re.M); s=re.sub(r'^bridgelessEnabled=.*$','bridgelessEnabled=false',s,flags=re.M); s=re.sub(r'^reactNativeArchitectures=.*$','reactNativeArchitectures=arm64-v8a',s,flags=re.M); p.write_text(s)
          PY
      - name: Install native notifications
        run: python3 scripts/setup_notifications.py
      - name: Verify React Native component registration
        run: |
          grep -n 'getMainComponentName' android/app/src/main/java/com/pricewatchnative/MainActivity.kt
          grep -q 'getMainComponentName(): String = "PriceWatch"' android/app/src/main/java/com/pricewatchnative/MainActivity.kt
          grep -q 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/raw/price_watch_alert.wav
          grep -q 'PriceWatchNotificationReceiver' android/app/src/main/AndroidManifest.xml
      - name: Build release APK
        run: cd android && ./gradlew :app:assembleRelease --no-daemon
      - name: Inspect APK
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          "$AAPT2" dump badging android/app/build/outputs/apk/release/app-release.apk | grep -E "package:|launchable-activity:|application-label:"
          test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PriceWatch-Clean-APK
          path: android/app/build/outputs/apk/release/app-release.apk

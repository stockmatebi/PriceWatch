name: Build Clean Price Watch APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Generate clean Android project
        run: |
          rm -rf android PriceWatchNative
          npx @react-native-community/cli@20.0.1 init PriceWatchNative --version 0.81.5 --skip-install
          rm -rf PriceWatchNative/src PriceWatchNative/App.tsx PriceWatchNative/App.js PriceWatchNative/index.js
          cp App.js index.js app.json babel.config.js metro.config.js PriceWatchNative/
          cp -R PriceWatchNative/android ./android
          rm -rf PriceWatchNative
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/com/pricewatchnative/MainActivity.kt')
          s=p.read_text()
          old='getMainComponentName(): String = "PriceWatchNative"'
          new='getMainComponentName(): String = "PriceWatch"'
          if old not in s:
              raise SystemExit('Expected React Native main component name was not found')
          p.write_text(s.replace(old,new))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          s = re.sub(r'android:label="[^"]+"', 'android:label="PriceWatch"', s, count=1)
          s = re.sub(r'android:icon="@mipmap/[^"]+"', 'android:icon="@mipmap/ic_launcher"', s, count=1)
          s = re.sub(r'android:roundIcon="@mipmap/[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', s, count=1)
          manifest.write_text(s)

          strings = Path('android/app/src/main/res/values/strings.xml')
          if strings.exists():
              ss = strings.read_text()
              ss = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">PriceWatch</string>', ss)
              strings.write_text(ss)

          res = Path('android/app/src/main/res')
          (res / 'mipmap-anydpi-v26').mkdir(parents=True, exist_ok=True)
          (res / 'drawable').mkdir(parents=True, exist_ok=True)
          (res / 'values').mkdir(parents=True, exist_ok=True)

          logo_vector = '''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#12161C" android:pathData="M12,12 L96,12 L96,96 L12,96 Z" android:fillAlpha="0.0" />
              <path android:strokeColor="#FF3340" android:strokeWidth="8" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="@android:color/transparent"
                    android:pathData="M20,76 L39,56 L52,65 L70,42 L88,24" />
              <path android:fillColor="#FF3340" android:pathData="M78,23 L92,21 L88,36 Z" />
              <path android:fillColor="#F5BE28" android:pathData="M63,17 L89,17 L89,39 L76,52 L63,39 Z" />
              <path android:fillColor="#12161C" android:pathData="M69,23 L82,23 L82,31 L75,38 L69,32 Z" />
              <path android:fillColor="#F5BE28" android:pathData="M18,77 L24,77 L24,83 L18,83 Z" />
          </vector>'''
          (res / 'drawable/pricewatch_launcher_foreground.xml').write_text(logo_vector)
          (res / 'drawable/pricewatch_mark.xml').write_text(logo_vector)

          (res / 'mipmap-anydpi-v26/ic_launcher.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/pricewatch_launcher_background" />
              <foreground android:drawable="@drawable/pricewatch_launcher_foreground" />
          </adaptive-icon>''')

          (res / 'mipmap-anydpi-v26/ic_launcher_round.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/pricewatch_launcher_background" />
              <foreground android:drawable="@drawable/pricewatch_launcher_foreground" />
          </adaptive-icon>''')

          (res / 'values/pricewatch_colors.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="pricewatch_launcher_background">#08090D</color>
          </resources>''')
          PY
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image
          from collections import deque
          import io, math

          urls = {
              'pw_npc_blue': 'https://res.cloudinary.com/agrimark/image/upload/q_auto/f_auto/c_pad%2Ch_570%2Cw_570/v1/uploads/assets/NPC-32-5-00ae90.png',
              'pw_double_roman': 'https://www.cashbuild.co.za/32338-small_default/double-roman-roof-tile.jpg',
              'pw_m150': 'https://killarneybrick.co.za/wp-content/uploads/2019/04/m150.jpg',
          }

          out = Path('android/app/src/main/res/drawable-nodpi')
          out.mkdir(parents=True, exist_ok=True)

          def remove_edge_background(im, threshold=34):
              im = im.convert('RGBA')
              px = im.load()
              w, h = im.size
              bg = px[0, 0][:3]
              seen = bytearray(w * h)
              q = deque([(0, 0)])
              seen[0] = 1
              def close(c):
                  return math.sqrt(sum((int(c[i]) - int(bg[i])) ** 2 for i in range(3))) <= threshold
              while q:
                  x, y = q.popleft()
                  px[x, y] = (px[x, y][0], px[x, y][1], px[x, y][2], 0)
                  for nx, ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                      if 0 <= nx < w and 0 <= ny < h:
                          idx = ny*w + nx
                          if not seen[idx] and close(px[nx,ny]):
                              seen[idx] = 1
                              q.append((nx,ny))
              return im

          for name, url in urls.items():
              req = Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urlopen(req, timeout=60) as response:
                  data = response.read()
              im = Image.open(io.BytesIO(data))
              im.thumbnail((700, 700), Image.Resampling.LANCZOS)
              im = remove_edge_background(im)
              im.save(out / f'{name}.png', 'PNG', optimize=True)
              print(f'Saved {name}.png: {im.size}')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/gradle.properties')
          s=p.read_text()
          import re
          for k in ('newArchEnabled','bridgelessEnabled'):
              s=re.sub(r'^'+k+r'=.*$',k+'=false',s,flags=re.M)
          if 'newArchEnabled=' not in s: s+='\nnewArchEnabled=false\n'
          if 'bridgelessEnabled=' not in s: s+='\nbridgelessEnabled=false\n'
          s=re.sub(r'^reactNativeArchitectures=.*$', 'reactNativeArchitectures=arm64-v8a', s, flags=re.M)
          if 'reactNativeArchitectures=' not in s: s+='\nreactNativeArchitectures=arm64-v8a\n'
          p.write_text(s)
          PY
      - name: Install native notifications
        run: python3 scripts/setup_notifications.py
      - name: Verify React Native component registration
        run: |
          grep -n 'getMainComponentName' android/app/src/main/java/com/pricewatchnative/MainActivity.kt
          grep -q 'getMainComponentName(): String = "PriceWatch"' android/app/src/main/java/com/pricewatchnative/MainActivity.kt
          grep -q 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/raw/price_watch_alert.wav
          grep -q 'PriceWatchNotificationReceiver' android/app/src/main/AndroidManifest.xml
      - name: Build release APK
        run: cd android && ./gradlew :app:assembleRelease --no-daemon
      - name: Inspect APK
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          "$AAPT2" dump badging android/app/build/outputs/apk/release/app-release.apk | grep -E "package:|launchable-activity:|application-label:"
          test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PriceWatch-Clean-APK
          path: android/app/build/outputs/apk/release/app-release.apk

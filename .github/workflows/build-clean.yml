name: Build Clean Price Watch APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Generate clean Android project
        run: |
          rm -rf android PriceWatchNative
          npx @react-native-community/cli@20.0.1 init PriceWatchNative --version 0.81.5 --skip-install
          rm -rf PriceWatchNative/src PriceWatchNative/App.tsx PriceWatchNative/App.js PriceWatchNative/index.js
          cp App.js index.js app.json babel.config.js metro.config.js PriceWatchNative/
          cp -R PriceWatchNative/android ./android
          rm -rf PriceWatchNative
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/com/pricewatchnative/MainActivity.kt')
          s=p.read_text()
          old='getMainComponentName(): String = "PriceWatchNative"'
          new='getMainComponentName(): String = "PriceWatch"'
          if old not in s:
              raise SystemExit('Expected React Native main component name was not found')
          p.write_text(s.replace(old,new))
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/gradle.properties')
          s=p.read_text()
          import re
          for k in ('newArchEnabled','bridgelessEnabled'):
              s=re.sub(r'^'+k+r'=.*$',k+'=false',s,flags=re.M)
          if 'newArchEnabled=' not in s: s+='\nnewArchEnabled=false\n'
          if 'bridgelessEnabled=' not in s: s+='\nbridgelessEnabled=false\n'
          s=re.sub(r'^reactNativeArchitectures=.*$', 'reactNativeArchitectures=arm64-v8a', s, flags=re.M)
          if 'reactNativeArchitectures=' not in s: s+='\nreactNativeArchitectures=arm64-v8a\n'
          p.write_text(s)
          PY
      - name: Install native notifications
        run: python3 scripts/setup_notifications.py
      - name: Verify React Native component registration
        run: |
          grep -n 'getMainComponentName' android/app/src/main/java/com/pricewatchnative/MainActivity.kt
          grep -q 'getMainComponentName(): String = "PriceWatch"' android/app/src/main/java/com/pricewatchnative/MainActivity.kt
          grep -q 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/raw/price_watch_alert.wav
          grep -q 'PriceWatchNotificationReceiver' android/app/src/main/AndroidManifest.xml
      - name: Build release APK
        run: cd android && ./gradlew :app:assembleRelease --no-daemon
      - name: Inspect APK
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          "$AAPT2" dump badging android/app/build/outputs/apk/release/app-release.apk | grep -E "package:|launchable-activity:|application-label:"
          test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PriceWatch-Clean-APK
          path: android/app/build/outputs/apk/release/app-release.apk

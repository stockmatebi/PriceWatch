name: Build Price Watch APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Price Watch Standalone APK on GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate Android shell
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/generate_android_shell.py

      - name: Generate notification tone
        run: python3 scripts/generate_notification_tone.py

      - name: Copy notification tone into Android resources
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/price_alert.wav android/app/src/main/res/raw/price_alert.wav

      - name: Verify clean Android startup configuration
        run: |
          test -f android/app/src/main/java/com/pricewatch/app/MainActivity.kt
          test -f android/app/src/main/java/com/pricewatch/app/MainApplication.kt
          test -f android/gradle.properties
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          echo "Android startup files generated successfully."
          echo "--- MainActivity ---"
          cat android/app/src/main/java/com/pricewatch/app/MainActivity.kt
          echo "--- MainApplication ---"
          cat android/app/src/main/java/com/pricewatch/app/MainApplication.kt
          echo "--- gradle.properties ---"
          grep -E 'newArchEnabled|bridgelessEnabled' android/gradle.properties || true

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Inspect APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          stat -c '%s bytes' android/app/build/outputs/apk/release/app-release.apk
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -E 'ic_launcher|price_watch' | head -50 || true
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          "$AAPT2" dump badging android/app/build/outputs/apk/release/app-release.apk | grep -E "package:|launchable-activity:|application-label:"

      - name: Stage APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apk/PriceWatch-latest.apk
          test -s release-apk/PriceWatch-latest.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PriceWatch-Standalone-APK
          path: release-apk/PriceWatch-latest.apk
          retention-days: 30

# Standalone phone build: no emulator validation.

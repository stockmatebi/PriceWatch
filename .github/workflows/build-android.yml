name: Build Price Watch APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Price Watch Standalone APK on GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate Android shell
        run: |
          rm -rf PriceWatchNative android
          npx @react-native-community/cli@20.0.1 init PriceWatchNative --version 0.81.5 --skip-install
          rm -rf PriceWatchNative/src PriceWatchNative/App.tsx PriceWatchNative/App.js PriceWatchNative/index.js
          cp -R src PriceWatchNative/src
          cp App.js PriceWatchNative/App.js
          cp index.js PriceWatchNative/index.js
          cp babel.config.js PriceWatchNative/babel.config.js
          cp metro.config.js PriceWatchNative/metro.config.js
          cp app.json PriceWatchNative/app.json
          cp -R PriceWatchNative/android android

          find android/app/src/main -type f -print0 | xargs -0 sed -i 's/PriceWatchNative/PriceWatch/g; s/com\.pricewatchnative/com.pricewatch.app/g; s/com\.nativeshell/com.pricewatch.app/g'

          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'buildFeatures {' not in s:
              s = s.replace('android {', 'android {\n    buildFeatures {\n        buildConfig true\n    }', 1)
          elif 'buildConfig true' not in s:
              s = s.replace('buildFeatures {', 'buildFeatures {\n        buildConfig true', 1)
          s = s.replace('namespace "com.pricewatchnative"', 'namespace "com.pricewatch.app"')
          s = s.replace("namespace 'com.pricewatchnative'", "namespace 'com.pricewatch.app'")
          s = s.replace('applicationId "com.pricewatchnative"', 'applicationId "com.pricewatch.app"')
          s = s.replace("applicationId 'com.pricewatchnative'", "applicationId 'com.pricewatch.app'")
          p.write_text(s)
          PY

          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_price_watch.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#121417" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#F5BE28" android:pathData="M54,18a30,30 0,1 0,0 60a30,30 0,1 0,0 -60M54,28a20,20 0,1 1,0 40a20,20 0,1 1,0 -40M72,72l18,18l-7,7l-18,-18z"/>
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/ic_price_watch"')
          s=s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/ic_price_watch"')
          p.write_text(s)
          PY

      - name: Generate notification tone
        run: python3 scripts/generate_notification_tone.py

      - name: Copy notification tone into Android resources
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/price_alert.wav android/app/src/main/res/raw/price_alert.wav

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell am force-stop com.pricewatch.app
            adb shell monkey -p com.pricewatch.app 1
            sleep 8
            if adb shell pidof com.pricewatch.app >/dev/null; then
              echo "Price Watch launch smoke test passed"
            else
              echo "Price Watch failed to stay running"
              adb logcat -d -t 400 | grep -E "AndroidRuntime|FATAL EXCEPTION|ReactNative|Notifee|pricewatch" || true
              exit 1
            fi

      - name: Stage APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apk/PriceWatch-latest.apk
          test -s release-apk/PriceWatch-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PriceWatch-Standalone-APK
          path: release-apk/PriceWatch-latest.apk
          retention-days: 30

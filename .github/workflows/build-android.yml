name: Build Price Watch APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Price Watch Standalone APK on GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate Android shell
        run: |
          rm -rf NativeShell android
          npx @react-native-community/cli@20.0.1 init NativeShell --version 0.81.5 --skip-install
          rm -rf NativeShell/src NativeShell/App.tsx NativeShell/App.js NativeShell/index.js
          cp -R src NativeShell/src
          cp App.js NativeShell/App.js
          cp index.js NativeShell/index.js
          cp babel.config.js NativeShell/babel.config.js
          cp metro.config.js NativeShell/metro.config.js
          cp app.json NativeShell/app.json
          cp -R NativeShell/android android

          find android/app/src/main/java -type f -print0 | xargs -0 sed -i 's/com\.nativeshell/com.pricewatch.app/g'
          find android/app/src/main -type f -print0 | xargs -0 sed -i 's/com\.nativeshell/com.pricewatch.app/g'
          mkdir -p android/app/src/main/java/com/pricewatch/app

          if [ -d android/app/src/main/java/com/nativeshell ]; then
            cp -R android/app/src/main/java/com/nativeshell/. android/app/src/main/java/com/pricewatch/app/
            rm -rf android/app/src/main/java/com/nativeshell
          fi

          # Keep the generated Android namespace/application ID aligned with the Price Watch package.
          sed -i 's/com\.nativeshell/com.pricewatch.app/g' android/app/build.gradle

          # React Native 0.81's generated Kotlin references BuildConfig; explicitly enable its generation.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'buildFeatures {' not in s:
              s = s.replace('android {', 'android {\n    buildFeatures {\n        buildConfig true\n    }', 1)
          elif 'buildConfig true' not in s:
              s = s.replace('buildFeatures {', 'buildFeatures {\n        buildConfig true', 1)
          p.write_text(s)
          PY

      - name: Generate notification tone
        run: python3 scripts/generate_notification_tone.py

      - name: Copy notification tone into Android resources
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/price_alert.wav android/app/src/main/res/raw/price_alert.wav

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apk/PriceWatch-latest.apk
          test -s release-apk/PriceWatch-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PriceWatch-Standalone-APK
          path: release-apk/PriceWatch-latest.apk
          retention-days: 30

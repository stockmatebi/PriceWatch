name: Build Price Watch APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Price Watch Standalone APK on GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate Android shell
        run: |
          python3 -m pip install --quiet pillow
          rm -rf PriceWatchNative android
          npx @react-native-community/cli@20.0.1 init PriceWatchNative --version 0.81.5 --skip-install
          rm -rf PriceWatchNative/src PriceWatchNative/App.tsx PriceWatchNative/App.js PriceWatchNative/index.js
          cp -R src PriceWatchNative/src
          cp App.js PriceWatchNative/App.js
          cp index.js PriceWatchNative/index.js
          cp babel.config.js PriceWatchNative/babel.config.js
          cp metro.config.js PriceWatchNative/metro.config.js
          cp app.json PriceWatchNative/app.json
          cp -R PriceWatchNative/android android

          find android/app/src/main -type f -print0 | xargs -0 sed -i 's/PriceWatchNative/PriceWatch/g; s/com\.pricewatchnative/com.pricewatch.app/g; s/com\.nativeshell/com.pricewatch.app/g'

          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'buildFeatures {' not in s:
              s = s.replace('android {', 'android {\n    buildFeatures {\n        buildConfig true\n    }', 1)
          elif 'buildConfig true' not in s:
              s = s.replace('buildFeatures {', 'buildFeatures {\n        buildConfig true', 1)
          s = s.replace('namespace "com.pricewatchnative"', 'namespace "com.pricewatch.app"')
          s = s.replace("namespace 'com.pricewatchnative'", "namespace 'com.pricewatch.app'")
          s = s.replace('applicationId "com.pricewatchnative"', 'applicationId "com.pricewatch.app"')
          s = s.replace("applicationId 'com.pricewatchnative'", "applicationId 'com.pricewatch.app'")
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('android/app/src/main/res').rglob('strings.xml'):
              s = p.read_text()
              s = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">Price Watch</string>', s)
              p.write_text(s)
          PY

          # Replace every stock launcher icon with a real Price Watch icon.
          find android/app/src/main/res -type f -name 'ic_launcher*' -delete
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          root = Path('android/app/src/main/res')
          sizes = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          for density, size in sizes.items():
              d = root / f'mipmap-{density}'
              d.mkdir(parents=True, exist_ok=True)
              im = Image.new('RGBA', (size, size), (18,20,23,255))
              draw = ImageDraw.Draw(im)
              scale = size / 108.0
              draw.ellipse((18*scale,18*scale,78*scale,78*scale), outline=(245,190,40,255), width=max(2,int(8*scale)))
              draw.line((72*scale,72*scale,92*scale,92*scale), fill=(245,190,40,255), width=max(2,int(9*scale)))
              im.save(d / 'ic_launcher.png')
          PY

          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/price_watch_icon_background"/>
              <foreground android:drawable="@drawable/ic_price_watch_foreground"/>
          </adaptive-icon>
          EOF

          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/price_watch_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="price_watch_icon_background">#121417</color>
          </resources>
          EOF

          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_price_watch_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#F5BE28" android:pathData="M54,18a30,30 0,1 0,0 60a30,30 0,1 0,0 -60M54,28a20,20 0,1 1,0 40a20,20 0,1 1,0 -40M72,72l18,18l-7,7l-18,-18z"/>
          </vector>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', s, count=1)
          s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher"', s, count=1)
          p.write_text(s)
          PY

          # Native diagnostics run before React Native and persist startup failures.
          python3 - <<'PY'
          from pathlib import Path
          candidates = list(Path('android/app/src/main/java').rglob('MainApplication.kt'))
          if not candidates:
              raise SystemExit('MainApplication.kt not found')
          target = candidates[0]
          target.write_text(r'''package com.pricewatch.app

import android.app.Application
import android.os.Build
import android.util.Log
import com.facebook.react.PackageList
import com.facebook.react.ReactApplication
import com.facebook.react.ReactHost
import com.facebook.react.ReactNativeApplicationEntryPoint.loadReactNative
import com.facebook.react.defaults.DefaultReactHost.getDefaultReactHost
import java.io.File
import java.text.SimpleDateFormat
import java.util.Date
import java.util.Locale

class MainApplication : Application(), ReactApplication {
    override val reactHost: ReactHost by lazy {
        getDefaultReactHost(
            context = applicationContext,
            packageList = PackageList(this).packages,
        )
    }

    override fun onCreate() {
        super.onCreate()
        StartupDiagnostics.write(this, "APPLICATION_ONCREATE")
        StartupDiagnostics.write(
            this,
            "DEVICE ${Build.MANUFACTURER} ${Build.MODEL} Android ${Build.VERSION.RELEASE} API ${Build.VERSION.SDK_INT}"
        )

        val previousHandler = Thread.getDefaultUncaughtExceptionHandler()
        Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
            StartupDiagnostics.write(this, "UNCAUGHT_EXCEPTION thread=${thread.name}", throwable)
            previousHandler?.uncaughtException(thread, throwable)
        }

        try {
            StartupDiagnostics.write(this, "REACT_NATIVE_LOAD_START")
            loadReactNative(this)
            StartupDiagnostics.write(this, "REACT_NATIVE_LOAD_RETURNED")
        } catch (t: Throwable) {
            StartupDiagnostics.write(this, "REACT_NATIVE_LOAD_FAILED", t)
            throw t
        }
    }
}

object StartupDiagnostics {
    private const val TAG = "PriceWatchStartup"
    private const val FILE_NAME = "pricewatch_startup.log"

    fun write(app: Application, stage: String, throwable: Throwable? = null) {
        val timestamp = SimpleDateFormat("yyyy-MM-dd HH:mm:ss.SSS Z", Locale.US).format(Date())
        val text = buildString {
            append(timestamp).append(" | ").append(stage).append('\n')
            if (throwable != null) {
                append(throwable.javaClass.name).append(": ").append(throwable.message).append('\n')
                append(Log.getStackTraceString(throwable)).append('\n')
            }
        }
        try { Log.i(TAG, text) } catch (_: Throwable) { }
        try { File(app.filesDir, FILE_NAME).appendText(text) } catch (_: Throwable) { }
        try {
            val external = app.getExternalFilesDir(null)
            if (external != null) {
                val dir = File(external, "PriceWatch")
                if (!dir.exists()) dir.mkdirs()
                File(dir, FILE_NAME).appendText(text)
            }
        } catch (_: Throwable) { }
    }
}
''')
          print(f'Injected diagnostics into {target}')
          PY

      - name: Generate notification tone
        run: python3 scripts/generate_notification_tone.py

      - name: Copy notification tone into Android resources
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/price_alert.wav android/app/src/main/res/raw/price_alert.wav

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Inspect APK before emulator
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          stat -c '%s bytes' android/app/build/outputs/apk/release/app-release.apk
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -E 'ic_launcher|price_watch' | head -50 || true

      - name: Android emulator diagnostic launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: |
            set +e
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell am force-stop com.pricewatch.app
            ACTIVITY=$(adb shell cmd package resolve-activity --brief com.pricewatch.app | tail -n 1 | tr -d '\r')
            echo "Resolved activity: $ACTIVITY"
            adb shell am start -n "$ACTIVITY"
            sleep 12
            PID=$(adb shell pidof com.pricewatch.app | tr -d '\r')
            if [ -n "$PID" ]; then
              echo "PASS" > smoke-result.txt
              echo "Price Watch process is running: $PID"
            else
              echo "FAIL" > smoke-result.txt
              echo "Price Watch process is NOT running"
            fi
            mkdir -p smoke-diagnostics
            adb logcat -d -t 1200 > smoke-diagnostics/logcat.txt
            adb shell ls -la /sdcard/Android/data/com.pricewatch.app/files/PriceWatch > smoke-diagnostics/diagnostic-list.txt 2>&1
            adb shell cat /sdcard/Android/data/com.pricewatch.app/files/PriceWatch/pricewatch_startup.log > smoke-diagnostics/pricewatch_startup.log 2>&1
            adb shell dumpsys package com.pricewatch.app > smoke-diagnostics/package.txt 2>&1
            echo "Smoke result: $(cat smoke-result.txt)"
            exit 0

      - name: Verify launch result
        run: |
          test -f smoke-result.txt
          test "$(cat smoke-result.txt)" = "PASS"

      - name: Stage APK
        if: always()
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apk/PriceWatch-latest.apk
          test -s release-apk/PriceWatch-latest.apk

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PriceWatch-Standalone-APK
          path: |
            release-apk/PriceWatch-latest.apk
            smoke-result.txt
            smoke-diagnostics/
          retention-days: 30
